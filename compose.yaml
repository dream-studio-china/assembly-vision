# AssemblyVision edge deployment template (design 20.4, E5a).
#
# Template, not a finished deployment: image registry, storage paths, device
# mappings, TLS, and resource limits must be validated per customer site.
# The edge continues inspection while the central server is unreachable; the
# container never depends on central DNS at startup.
#
# Static dashboard assets: build with `pnpm --filter edge-web build` and copy
# the `dist/` output into the `edge-web` volume (served via --static).
#
# Secrets (E5b): prefer `AV_EDGE_API_TOKEN` from the environment or a Docker
# secret mounted at /run/secrets/edge_api_token. Never commit secret values.

services:
  edge-service:
    build:
      context: .
      dockerfile: apps/edge-service/Dockerfile
    image: registry.example.invalid/assemblyvision/edge-service:${AV_VERSION:-0.1.0}
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    ports:
      # Loopback binding is not authentication: keep the port on 127.0.0.1 or
      # terminate TLS in front and set AV_EDGE_API_TOKEN (design 15.2.1).
      - "127.0.0.1:8000:8000"
    environment:
      AV_EDGE_API_TOKEN: ${AV_EDGE_API_TOKEN:-}
    volumes:
      - edge-db:/var/lib/assemblyvision/db
      - edge-media:/var/lib/assemblyvision/media
      - edge-config:/etc/assemblyvision:ro
      - edge-models:/opt/assemblyvision/models:ro
      - edge-web:/opt/assemblyvision/web:ro
      - edge-tmp:/tmp
    command:
      - serve
      - --output
      - /var/lib/assemblyvision/media
      - --db
      - /var/lib/assemblyvision/db/edge.sqlite3
      - --config
      - /etc/assemblyvision/pipeline.yaml
      - --rule
      - /etc/assemblyvision/rule.yaml
      - --static
      - /opt/assemblyvision/web
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-m", "assemblyvision.healthcheck", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    networks:
      - edge-private

networks:
  edge-private: {}

volumes:
  edge-db: {}
  edge-media: {}
  edge-config: {}
  edge-models: {}
  edge-web: {}
  edge-tmp: {}
