[project]
name = "assemblyvision-training"
version = "0.1.0"
description = "AssemblyVision developer-only training CLI"
requires-python = ">=3.12"
dependencies = [
    "assemblyvision-domain",
    "assemblyvision-vision",
    "ultralytics>=8.0",
    "PyYAML>=6.0,<7",
]

[project.scripts]
av-train = "assemblyvision_training.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_training"]

[tool.uv.sources]
assemblyvision-domain = { workspace = true }
assemblyvision-vision = { workspace = true }
