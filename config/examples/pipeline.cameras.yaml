# Multi-instance pipeline example with camera sources (ADR-013, ADR-010).
#
# `assemblyvision serve --config config/examples/pipeline.cameras.yaml`
# opens one camera source per instance and, when `inspection.enabled` is true,
# runs the instance's inspection loop. An instance with a `temporal:` block
# groups captured frames into per-product windows and emits one record per
# window (per-component temporal aggregation); without it the loop emits one
# record per captured frame. Each instance carries its own models, thresholds,
# ROI, and rule; when `device_id` is null it defaults to uuid5(namespace,
# instance_id).
#
# Non-production thresholds: require model-specific validation before use.

application_version: "0.1.0"

instances:
  - instance_id: line-1
    device_id: null                     # default = uuid5(namespace, "line-1")
    camera:
      source: rtsp
      url: rtsp://192.168.1.10/stream
      fps: null
      reconnect:
        initial_delay_ms: 250
        maximum_delay_ms: 10000
    inspection:
      enabled: false                    # preview-only until the window milestone
    models:
      product_manifest: ../../models/manifests/product-manifest.json
      component_manifest: ../../models/manifests/component-manifest.json
    product_detection:
      model_version: product-yolo-1.0.0
      confidence_threshold: 0.70
      iou_threshold: 0.50
    component_detection:
      model_version: component-yolo-1.0.0
      iou_threshold: 0.50
      components:
        manual:
          observation_threshold: 0.45
        component_a:
          observation_threshold: 0.50
        component_b:
          observation_threshold: 0.50
    roi:
      margin_x_ratio: 0.05
      margin_y_ratio: 0.05
      min_area_pixels: 250000
      min_expanded_area_retained: 0.90
      normalize_perspective: false
    rule: ../../config/examples/product-rule.yaml

  - instance_id: line-2
    camera:
      source: video
      path: /data/line2.mp4
      fps: 25
    inspection:
      enabled: false
    models:
      product_manifest: ../../models/manifests/product-manifest.json
      component_manifest: ../../models/manifests/component-manifest.json
    product_detection:
      model_version: product-yolo-1.0.0
      confidence_threshold: 0.70
      iou_threshold: 0.50
    component_detection:
      model_version: component-yolo-1.0.0
      iou_threshold: 0.50
      components:
        manual:
          observation_threshold: 0.45
        component_a:
          observation_threshold: 0.50
    roi:
      margin_x_ratio: 0.05
      margin_y_ratio: 0.05
      min_area_pixels: 250000
      min_expanded_area_retained: 0.90
      normalize_perspective: false
    rule: ../../config/examples/product-rule.yaml

  - instance_id: bench
    camera:
      source: folder
      path: /data/images
      loop: true
      fps: 5
    inspection:
      enabled: false                   # time strategy is development-only
    temporal:
      # window_strategy: time is a development fallback that separates windows
      # only by capture-time gap. Production temporal inspection must use
      # "identity" (or another validated correlation mechanism) so frames of
      # different products can never merge into one window (PR-015 F1).
      window_strategy: time
      minimum_valid_frames: 3
      maximum_window_ms: 2500
      reject_duplicate_frame_ids: true
      components:
        manual:
          high_confidence: 0.90
          medium_confidence: 0.60
          medium_hits: 2
          require_adjacent_hits: true
          max_frame_gap: 1
        component_a:
          high_confidence: 0.90
          medium_confidence: 0.60
          medium_hits: 2
          require_adjacent_hits: true
          max_frame_gap: 1
        component_b:
          high_confidence: 0.90
          medium_confidence: 0.60
          medium_hits: 2
          require_adjacent_hits: true
          max_frame_gap: 1
    models:
      product_manifest: ../../models/manifests/product-manifest.json
      component_manifest: ../../models/manifests/component-manifest.json
    product_detection:
      model_version: product-yolo-1.0.0
      confidence_threshold: 0.70
      iou_threshold: 0.50
    component_detection:
      model_version: component-yolo-1.0.0
      iou_threshold: 0.50
      components:
        manual:
          observation_threshold: 0.45
        component_a:
          observation_threshold: 0.50
        component_b:
          observation_threshold: 0.50
    roi:
      margin_x_ratio: 0.05
      margin_y_ratio: 0.05
      min_area_pixels: 250000
      min_expanded_area_retained: 0.90
      normalize_perspective: false
    rule: ../../config/examples/product-rule.yaml
