name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy .

      - name: Edge OpenAPI drift check
        run: |
          uv run python scripts/generate-edge-openapi.py
          git diff --exit-code -- apps/edge-service/openapi/edge-openapi.json

      - name: Central OpenAPI drift check
        run: |
          uv run python scripts/generate-central-openapi.py
          git diff --exit-code -- apps/central-service/openapi/central-openapi.json

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install workspace
        run: uv sync

      - name: Pytest
        run: uv run pytest -n auto

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages and app
        run: pnpm -r build
        env:
          VITE_API_MODE: http

      - name: TypeScript contract drift check
        run: |
          pnpm --filter @assemblyvision/api-client generate:types
          git diff --exit-code -- packages/typescript/api-client/src/edge/generated/api.ts

      - name: Central TypeScript contract drift check
        run: |
          pnpm --filter @assemblyvision/api-client-central generate:types
          git diff --exit-code -- packages/typescript/api-client-central/src/central/generated/api.ts

      - name: Build admin-web
        run: cd apps/admin-web && pnpm build

      - name: Lint admin-web
        run: cd apps/admin-web && pnpm lint

      - name: Unit tests admin-web
        run: cd apps/admin-web && pnpm test

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm -r test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python edge service
        run: uv sync

      - name: Playwright install
        run: cd apps/edge-web && pnpm exec playwright install --with-deps chromium

      - name: E2E tests (edge-web)
        run: cd apps/edge-web && pnpm test:e2e

      - name: E2E tests (admin-web)
        run: cd apps/admin-web && pnpm test:e2e
