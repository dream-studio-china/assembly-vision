[project]
name = "assemblyvision-vision"
version = "0.1.0"
description = "AssemblyVision shared vision and preprocessing modules"
requires-python = ">=3.12"
dependencies = [
    "assemblyvision-domain",
    "pydantic>=2.7,<3",
    "Pillow>=10.0,<12",
]

[tool.uv.sources]
assemblyvision-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_vision"]
