[project]
name = "assemblyvision-vision"
version = "0.1.0"
description = "AssemblyVision shared vision and preprocessing modules"
requires-python = ">=3.12"
dependencies = [
    "assemblyvision-domain",
    "pydantic>=2.7,<3",
    "Pillow>=12.3.0,<13",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9"]
rtsp = ["av>=12,<16"]
http = ["httpx>=0.27,<1"]

[tool.uv.sources]
assemblyvision-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_vision"]
