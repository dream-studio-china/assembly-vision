[project]
name = "assemblyvision-domain"
version = "0.1.0"
description = "AssemblyVision canonical domain models, errors, and reason codes"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_domain"]
