# AssemblyVision central pilot compose deployment (design 05 section 10, C1a/C1b).
#
# Services: PostgreSQL, MinIO, central-migrate (one-shot controlled schema
# release step), central-bootstrap (one-shot pilot credential provisioning),
# central-service (API), and admin-web (built pilot UI).
#
# Copy compose.env.example into a private `.env` next to this compose file and
# set every required secret. This profile has no usable credential defaults;
# Compose refuses to start until every required value is non-empty. The admin
# web port binds to loopback only; publish it explicitly behind TLS for remote
# access.
#
# Run: docker compose -f apps/central-service/compose.yaml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the .env file}
    volumes:
      - central-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in the .env file} -d ${POSTGRES_DB:?set POSTGRES_DB in the .env file}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the .env file}
    volumes:
      - central-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  central-migrate:
    build:
      context: ../..
      dockerfile: apps/central-service/Dockerfile
    command: ["migrate"]
    environment:
      AV_CENTRAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in the .env file}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in the .env file}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  central-bootstrap:
    build:
      context: ../..
      dockerfile: apps/central-service/Dockerfile
    command: ["bootstrap"]
    environment:
      AV_CENTRAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in the .env file}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in the .env file}
      # Bootstrap tokens are mandatory. The bootstrap fails closed rather than
      # provisioning a publicly known credential.
      AV_CENTRAL_ADMIN_TOKEN: ${CENTRAL_ADMIN_TOKEN:?set CENTRAL_ADMIN_TOKEN in the .env file}
      AV_CENTRAL_DEVICE_UPLOAD_TOKEN: ${CENTRAL_DEVICE_UPLOAD_TOKEN:?set CENTRAL_DEVICE_UPLOAD_TOKEN in the .env file}
    depends_on:
      central-migrate:
        condition: service_completed_successfully
    restart: "no"

  central-service:
    build:
      context: ../..
      dockerfile: apps/central-service/Dockerfile
    environment:
      AV_CENTRAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in the .env file}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in the .env file}
      AV_CENTRAL_MINIO_ENDPOINT: minio:9000
      AV_CENTRAL_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the .env file}
      AV_CENTRAL_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the .env file}
      AV_CENTRAL_MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in the .env file}
      AV_CENTRAL_MINIO_SECURE: "false"
      # Secure session cookies are the safe default. Plain-HTTP loopback
      # development must opt out in the .env file.
      AV_CENTRAL_SECURE_COOKIES: ${CENTRAL_SECURE_COOKIES:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      central-migrate:
        condition: service_completed_successfully
      central-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "central_service.healthcheck", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    depends_on:
      central-service:
        condition: service_healthy
    # Loopback-only by default: the pilot admin API carries credentials, so
    # it is never published to all interfaces over plain HTTP. Expose
    # explicitly (e.g. "8080:80") only behind TLS termination.
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  central-pgdata:
  central-miniodata:
