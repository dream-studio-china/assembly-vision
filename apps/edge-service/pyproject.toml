[project]
name = "assemblyvision-edge"
version = "0.1.0"
description = "AssemblyVision edge inspection runtime (static-image MVP + local API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "assemblyvision-domain",
    "assemblyvision-vision[video,rtsp,http,gige]",
    "ultralytics>=8.0",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "Pillow>=12.3.0,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "zxing-cpp>=2.3,<3",
    "questionary>=2.1.1",
]

[tool.uv.sources]
assemblyvision-domain = { workspace = true }
assemblyvision-vision = { workspace = true }

[project.scripts]
assemblyvision = "assemblyvision_edge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=7.1",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "httpx>=0.27,<1",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_edge"]
