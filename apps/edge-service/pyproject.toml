[project]
name = "assemblyvision-edge"
version = "0.1.0"
description = "AssemblyVision edge inspection runtime (static-image MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "Pillow>=10.0,<12",
]

[project.scripts]
assemblyvision = "assemblyvision_edge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assemblyvision_edge"]
