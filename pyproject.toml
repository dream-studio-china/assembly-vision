[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/edge-service", "packages/python/domain", "packages/python/vision-core", "training"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["site", "docs-zh", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S608"]
"tests/**" = ["S101"]
"scripts/generate-synthetic-dataset.py" = ["S311"]
"apps/edge-service/src/assemblyvision_edge/api/routers/**" = ["B008"]
"apps/edge-service/src/assemblyvision_edge/persistence/**" = ["S608"]
"apps/edge-service/migrations/**" = ["UP007", "UP035", "I001", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["site", "docs-zh", "docs"]

[tool.pytest.ini_options]
testpaths = ["apps/edge-service/tests", "training/tests", "scripts/tests"]
addopts = "-q"
markers = [
    "slow: slower training or integration tests",
]
